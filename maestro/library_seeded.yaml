appId: ${APP_ID}
---
- launchApp:
    clearState: true
    stopApp: true
    arguments:
      OPENCLAW_UI_TEST_MODE: 1
      OPENCLAW_UI_TEST_SCENARIO: ${OPENCLAW_UI_TEST_SCENARIO}
      OPENCLAW_UI_TEST_DISABLE_AUDIO: 1
- assertVisible:
    id: "chordlab.tab.library.root"
- assertVisible: "OpenClaw Turnaround"
- assertVisible:
    id: "chordlab.library.card"
- takeScreenshot: "chordlab-library-seeded"
